name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # macos-26, not macos-14: the SDK an app is linked against is what macOS
    # reads to decide which design language to draw it in. macos-14's newest
    # Xcode (16.2) ships the macOS 15 SDK, so every published build came out
    # drawing itself in the pre-Tahoe appearance — square-ish window corners,
    # edge-to-edge sidebar, boxed popup-button chevrons — while local builds
    # (Xcode 26, macOS 26 SDK) looked correct. Same deployment target either
    # way; only the SDK changes.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select newest available Xcode
        # The image's default is already the newest, but pinning to "highest
        # installed" rather than a version string means a future image bump
        # can't silently drop us onto an older SDK again.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Lint
        run: make lint
      - name: Build
        run: swift build

  publish-build:
    # Only main, and only after validate passes: a broken commit must never
    # overwrite the build people are downloading. pull_request runs of
    # `validate` never reach this job since it isn't in their `needs` chain
    # trigger at all (see the `if`).
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Same macOS 26 SDK reason as `validate` above — doubly so here, since
    # this is the job whose output people actually download and look at.
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select newest available Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Record build timestamp and version
        # Computed once and reused everywhere below, so the release notes and
        # the appcast's pubDate can't end up a few seconds apart from two
        # separate `date` calls. Two timestamp formats: ISO 8601 for the
        # human-readable release notes, RFC 2822 for the appcast (RSS/pubDate's
        # own format). VERSION (0.1.<build>) is the one human-readable version
        # string shared by Info.plist's CFBundleShortVersionString, the
        # appcast, the versioned GitHub release tag, and the Homebrew cask —
        # a single number to bump would be nicer, but nothing here has a
        # human deciding on real semver bumps, so the always-unique,
        # always-increasing build number is what actually stays true.
        run: |
          echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")" >> "$GITHUB_ENV"
          echo "VERSION=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Resolve Sparkle's CLI tools
        # `swift package resolve` (not a full build) is enough to pull the
        # binary artifact SPM fetches for Sparkle, which includes `sign_update`
        # at .build/artifacts/sparkle/Sparkle/bin/ — needed below to sign the
        # release for the auto-updater.
        run: swift package resolve
      - name: Stamp the build number into Info.plist
        # github.run_number is monotonically increasing per workflow run
        # (including failed ones), so it's a reliable version number for
        # Sparkle (appcast.xml's sparkle:version, below) to compare against
        # — plain incrementing integer, no need to track or parse commit
        # SHAs. Patches the checked-out copy only; the committed Info.plist
        # keeps its placeholder "1" for
        # local/Xcode dev builds, which is deliberately always older than
        # anything published. CFBundleShortVersionString gets the same
        # treatment now that VERSION feeds the appcast and the Homebrew cask
        # too — it stays the committed "0.1.0" placeholder for local builds.
        run: |
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Sources/Nimbus/Info.plist
          plutil -replace CFBundleShortVersionString -string "${{ env.VERSION }}" Sources/Nimbus/Info.plist
      - name: Build release .app via Xcode
        # swift build only produces a bare executable, not a real .app bundle
        # (no Info.plist, icon, or resources) — see CLAUDE.md. Nimbus.xcodeproj
        # is the entry point that produces a distributable bundle.
        # Unsigned on purpose: no Apple Developer account is wired into CI, so
        # people downloading this will need to right-click > Open the first
        # time to get past Gatekeeper's unidentified-developer warning.
        run: |
          xcodebuild \
            -project Nimbus.xcodeproj \
            -scheme Nimbus \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Zip the app
        # ditto, not zip: it preserves resource forks and extended attributes,
        # which is what Apple's own tooling uses to archive .app bundles.
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent Nimbus.app Nimbus.zip
      - name: Sign the update and write appcast.xml
        # SPARKLE_PRIVATE_KEY is the EdDSA private key `generate_keys` made —
        # unrelated to GitHub auth, it's what proves an update actually came
        # from this pipeline. sign_update --ed-key-file - reads it from
        # stdin. appcast.xml is what AppUpdater.swift's SUFeedURL points at:
        # the single source of truth the app checks against, nothing else.
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_BIN=.build/artifacts/sparkle/Sparkle/bin
          SIGNATURE_ATTRS=$(echo "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/sign_update" --ed-key-file - build/Build/Products/Release/Nimbus.zip)
          cat > build/Build/Products/Release/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Nimbus</title>
              <item>
                <title>Build ${{ github.run_number }}</title>
                <pubDate>${{ env.PUB_DATE }}</pubDate>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>${{ env.VERSION }}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <enclosure url="https://github.com/CarlosAllberto/nimbus-desktop-releases/releases/download/latest/Nimbus.zip" $SIGNATURE_ATTRS type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF
      - name: Publish to nimbus-desktop-releases
        env:
          # A PAT with Contents: read/write on CarlosAllberto/nimbus-desktop-releases.
          # The default GITHUB_TOKEN only has permissions inside *this* repo, so
          # publishing to a different one needs its own token. gh reads GH_TOKEN.
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        # A single rolling "latest" release, overwritten on every push, so the
        # one link people bookmark never changes. The versioned desktop-v0.1.x
        # releases already in that repo are from the old Tauri build and are
        # left alone; this only ever touches the "latest" tag.
        run: |
          REPO=CarlosAllberto/nimbus-desktop-releases
          NOTES="Automatic build from CarlosAllberto/nimbus-desktop@${{ github.sha }} (build ${{ github.run_number }}), built ${{ env.BUILT_AT }}.

          Unsigned: no Apple Developer ID on this build. If Gatekeeper blocks it, right-click Nimbus.app > Open, or allow it in System Settings > Privacy & Security."

          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit latest --repo "$REPO" --title "Nimbus (latest build)" --notes "$NOTES"
          else
            gh release create latest --repo "$REPO" --title "Nimbus (latest build)" --notes "$NOTES"
          fi
          gh release upload latest build/Build/Products/Release/Nimbus.zip build/Build/Products/Release/appcast.xml --repo "$REPO" --clobber
      - name: Publish a versioned release for Homebrew
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        # Unlike "latest" above, this tag is never touched again once
        # created — Homebrew casks need a URL+checksum pair that stays valid
        # forever once published, or `brew upgrade` and reinstalling an old
        # version both break. One new release per push to main, same as
        # "latest"'s own cadence.
        run: |
          REPO=CarlosAllberto/nimbus-desktop-releases
          gh release create "v${{ env.VERSION }}" build/Build/Products/Release/Nimbus.zip \
            --repo "$REPO" \
            --title "Nimbus ${{ env.VERSION }}" \
            --notes "Automatic build from CarlosAllberto/nimbus-desktop@${{ github.sha }} (build ${{ github.run_number }}), built ${{ env.BUILT_AT }}.

          Unsigned: no Apple Developer ID on this build. If Gatekeeper blocks it, right-click Nimbus.app > Open, or allow it in System Settings > Privacy & Security."
      - name: Update the Homebrew tap
        env:
          # A PAT with Contents: read/write on CarlosAllberto/homebrew-nimbus
          # only — separate from RELEASES_REPO_TOKEN the same way that one is
          # separate from GITHUB_TOKEN, least-privilege per repo it touches.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA256=$(shasum -a 256 build/Build/Products/Release/Nimbus.zip | cut -d' ' -f1)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/CarlosAllberto/homebrew-nimbus.git" tap
          cat > tap/Casks/nimbus.rb <<CASK
          cask "nimbus" do
            version "${{ env.VERSION }}"
            sha256 "$SHA256"

            url "https://github.com/CarlosAllberto/nimbus-desktop-releases/releases/download/v#{version}/Nimbus.zip"
            name "Nimbus"
            desc "Menu-bar toolbox for web, image, code, and utility tools"
            homepage "https://www.nimbushelp.com/"

            # Nimbus updates itself via Sparkle once installed — brew upgrade is a
            # catch-up path, not the primary update channel.
            auto_updates true
            # Unsigned: no Apple Developer ID on this build. Gatekeeper blocks it on
            # first launch unless the user right-clicks > Open, or allows it in System
            # Settings > Privacy & Security.

            depends_on macos: :sonoma

            app "Nimbus.app"

            zap trash: [
              "~/Library/Caches/com.treendz.nimbus",
              "~/Library/Preferences/com.treendz.nimbus.plist",
            ]
          end
          CASK
          cd tap
          git config user.name "nimbus-ci"
          git config user.email "ci@nimbushelp.com"
          git add Casks/nimbus.rb
          git commit -m "nimbus ${{ env.VERSION }}"
          git push
      - name: Print download link
        run: echo "Download -> https://github.com/CarlosAllberto/nimbus-desktop-releases/releases/download/latest/Nimbus.zip"
